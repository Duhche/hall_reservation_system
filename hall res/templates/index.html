<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hall Reservation System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
    padding:30px;
}

.container{
    max-width:900px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:25px;
    color:#333;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
    margin-bottom:20px;
}

h2{
    margin-bottom:15px;
    color:#444;
}

input, select{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    background:#0078ff;
    color:white;
    border:none;
    padding:10px 16px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#005fd1;
}

ul{
    list-style:none;
}

li{
    padding:12px;
    background:#f7f7f7;
    margin-bottom:8px;
    border-radius:6px;
}

.success{
    color:green;
    margin-top:10px;
}

.error{
    color:red;
    margin-top:10px;
}

.hall-box{
    background:#eef5ff;
    padding:10px;
    border-radius:6px;
    margin-top:10px;
}
</style>
</head>
<body>

<div class="container">

    <h1>🏢 Hall Reservation System</h1>

    <div class="card">
        <h2>Hall Recommendation</h2>

        <input
            type="number"
            id="attendees"
            placeholder="Number of attendees"
        >

        <button onclick="recommendHall()">
            Recommend Hall
        </button>

        <div id="recommendation"></div>
    </div>

    <div class="card">
        <h2>Create Reservation</h2>

        <select id="hall">
            <option value="1">Conference Hall (100)</option>
            <option value="2">Meeting Room A (20)</option>
            <option value="3">Meeting Room B (15)</option>
        </select>

        <input
            type="text"
            id="user"
            placeholder="Your Name"
        >

        <input
            type="number"
            id="start"
            placeholder="Start Hour (0-23)"
        >

        <input
            type="number"
            id="end"
            placeholder="End Hour (0-23)"
        >

        <button onclick="reserveHall()">
            Reserve Hall
        </button>

        <div id="message"></div>
    </div>

    <div class="card">
        <h2>Reservations</h2>

        <ul id="reservationList"></ul>
    </div>

</div>

<script>

const halls = [
    {id:1, name:"Conference Hall", capacity:100},
    {id:2, name:"Meeting Room A", capacity:20},
    {id:3, name:"Meeting Room B", capacity:15}
];

let reservations =
    JSON.parse(localStorage.getItem("reservations")) || [];

function saveReservations(){
    localStorage.setItem(
        "reservations",
        JSON.stringify(reservations)
    );
}

function recommendHall(){

    const attendees =
        Number(document.getElementById("attendees").value);

    const suitable =
        halls.filter(h => h.capacity >= attendees);

    const result =
        document.getElementById("recommendation");

    if(suitable.length === 0){
        result.innerHTML =
            "<p class='error'>No suitable hall found.</p>";
        return;
    }

    suitable.sort(
        (a,b)=>a.capacity-b.capacity
    );

    const hall = suitable[0];

    result.innerHTML = `
        <div class="hall-box">
            Recommended:
            <strong>${hall.name}</strong>
            (${hall.capacity} seats)
        </div>
    `;
}

function hasConflict(hallId,start,end){

    return reservations.some(r =>
        r.hallId === hallId &&
        r.start < end &&
        r.end > start
    );
}

function reserveHall(){

    const hallId =
        Number(document.getElementById("hall").value);

    const user =
        document.getElementById("user").value;

    const start =
        Number(document.getElementById("start").value);

    const end =
        Number(document.getElementById("end").value);

    const msg =
        document.getElementById("message");

    if(!user){
        msg.innerHTML =
            "<p class='error'>Enter a user name.</p>";
        return;
    }

    if(start >= end){
        msg.innerHTML =
            "<p class='error'>Invalid time range.</p>";
        return;
    }

    if(hasConflict(hallId,start,end)){
        msg.innerHTML =
            "<p class='error'>Hall already booked.</p>";
        return;
    }

    reservations.push({
        hallId,
        user,
        start,
        end
    });

    saveReservations();
    loadReservations();

    msg.innerHTML =
        "<p class='success'>Reservation created.</p>";
}

function loadReservations(){

    const list =
        document.getElementById("reservationList");

    list.innerHTML = "";

    reservations.forEach(r=>{

        const hall =
            halls.find(h=>h.id===r.hallId);

        const li =
            document.createElement("li");

        li.innerHTML = `
            <strong>${r.user}</strong>
            booked
            <strong>${hall.name}</strong>
            from ${r.start}:00
            to ${r.end}:00
        `;

        list.appendChild(li);
    });
}

loadReservations();

</script>

</body>
</html>
